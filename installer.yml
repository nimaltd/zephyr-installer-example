# Read by zephyr-installer. See https://github.com/nimaltd/zephyr-installer
#
# A library made to try the installer on, and a starting point for your own:
# copy this file to the root of your library's repository, and change what is
# yours. Only name and files are required. The keys this library has no use
# for are here too, commented out, so every one is in one place.
#
# There is no version here. The installer reads it from the @version tag in
# the first header listed, so the source files are the only place it is written.

name: example                      # the library's name, its folder and its Kconfig symbol
description: A period that never blocks, made to try zephyr-installer on
repository: https://github.com/nimaltd/zephyr-installer-example
license: Apache-2.0                # the licence's SPDX name

kind: utility                      # driver, middleware, rtos, protocol, filesystem,
                                   # utility or bsp
category: timing                   # sensor, storage, display, communication, wireless,
                                   # rtos, timing, power, input, math or system
provides: []                       # what it gives other libraries: [rtos] for an RTOS

requires:
  zephyr_installer: 1.0.0          # the oldest zephyr-installer that reads this file
  libraries: []                    # other libraries, installed first when missing:
                                   #   - osal >= 1.0.0   no owner means nimaltd
                                   #   - owner/lib       anyone else's
  kconfig:                         # symbols it needs, set in the Kconfig file
    - PRINTK                       # a symbol alone is set to y; SYMBOL=value also works
  peripherals: []                  # hardware it uses, named to the user, such as:
                                   #   - type: i2c
                                   #     note: 400 kHz

install:
  layout: mirror                   # mirror keeps the repository's folders, here src/,
                                   # flat puts every file at the top
  # include_dirs: [src]            # include folders, only when the guess is wrong
  # defines:                       # given to the whole build
  #   - EXAMPLE_FAST               # NAME, or NAME=value

files:
  headers:                         # .h files; the first is the one to #include
    - src/example.h
  sources:                         # .c files, built when the library is switched on
    - src/example.c

options:                           # parts the user chooses at install
  uptime:                          # the name typed after --with and --without
    description: Uptime in hours, minutes and seconds   # the question asked
    libraries: []                  # libraries this part needs, installed first
    files:
      headers:
        - src/example_uptime.h
      sources:
        - src/example_uptime.c

extras:                            # copied as they are, never compiled
  - LICENSE.md
  - NOTICE
  - README.md

zephyr:                            # read by zephyr-installer only
  kconfig: EXAMPLE                 # the library's symbol; the name in capitals when left out
  # cmake:                         # lines of CMake added to the module, inside if(CONFIG_X)
  #   - zephyr_library_compile_options(-O2)
  settings:                        # Kconfig symbols the user sets, CONFIG_<name> in the code
    - name: EXAMPLE_PERIOD_MS      # the symbol, started with the library's own
      type: int                    # bool, int, hex or string
      default: 500                 # required: true or false, a number, 0x.. or text
      range: [1, 86400000]         # int and hex only: [smallest, largest]
      prompt: Milliseconds between two times example_due() says yes
      help: |
        A loop that calls example_due() gets a yes once every this many
        milliseconds, and never waits for it.
    - name: EXAMPLE_GREETING
      type: string
      default: Hello from example
      prompt: What example_hello() prints
