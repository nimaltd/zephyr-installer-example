# Read by lib-installer. See https://github.com/nimaltd/lib-installer
#
# A library made to try the installer on, and a starting point for your own:
# copy this file to the root of your library's repository, and change what is
# yours. Only name and its headers or sources are required. The keys this
# library has no use for are here too, commented out, so every one is in one
# place.
#
# There is no version here. The installer reads it from the @version tag in
# the first header listed, so the source files are the only place it is written.
#
# Written for 4.0.0: every file keeps the path it has here, src/example.h
# lands at modules/example/src/example.h, and every path naming a place in
# the application starts at the application's folder. What the library writes
# sits under where it goes, zephyr.project for the application's own files and
# zephyr.library for the library's own folder, and a list can be given in
# groups under their titles, a setting with a note.

name: example                      # the library's name, its folder and its Kconfig symbol
description: A period that never blocks, made to try lib-installer on
repository: https://github.com/nimaltd/lib-installer-example-zephyr
license: Apache-2.0                # the licence's SPDX name
platform: zephyr                   # the projects it is for: stm32, zephyr, esp32,
                                   # arduino and pio, one or a list of them

kind: utility                      # driver, middleware, rtos, protocol, filesystem,
                                   # utility or bsp
category: timing                   # sensor, storage, display, communication, wireless,
                                   # rtos, timing, power, input, math or system
provides: []                       # what it gives other libraries: [rtos] for an RTOS

requires:
  lib_installer: 4.0.0             # the oldest lib-installer that reads this file
  libraries: []                    # other libraries, installed first when missing:
                                   #   - osal >= 1.0.0       no owner means nimaltd
                                   #   - owner/lib           anyone else's
                                   #   - owner/lib@v1.2.0    a tag, branch or commit
                                   #   - source: owner/other@v2.0.0
                                   #     manifest: manifests/other.yml
                                   #                         for a repository with no
                                   #                         installer.yml of its own
  peripherals: []                  # hardware it uses, named to the user, such as:
                                   #   - type: i2c
                                   #     note: 400 kHz

# install:
#   include_dirs: [src]            # include folders, only when the guess is wrong
#   defines:                       # given to the whole build
#     - EXAMPLE_FAST               # NAME, or NAME=value

headers:                           # .h files; the first is the one to #include
  - src/example.h                  # every file keeps its path: modules/example/src/example.h
sources:                           # .c files, built when the library is switched on
  - src/example.c
                                   # a wildcard works too: src/*.c in one folder,
                                   # src/**/*.c in every folder below src

options:                           # parts the user chooses at install
  uptime:                          # the name typed after --with and --without
    description: Uptime in hours, minutes and seconds   # the question asked
    libraries: []                  # libraries this part needs, installed first
    headers:                       # its files, written like headers and sources above
      - src/example_uptime.h
    sources:
      - src/example_uptime.c

extras:                            # copied as they are, never compiled
  - LICENSE.md                     # in the library's folder: modules/example/LICENSE.md
  - NOTICE
  - README.md
  - root: tools                    # tools/ into the application's folder instead, as the
                                   # library's own: written again on every install,
                                   # removed by an uninstall

once:                              # the application's own files, made when missing and
                                   # the user's from then on: never replaced or removed
  - from: project/example.conf     # its settings, added to the build by the
    to: example.conf               # before-zephyr lines below. A path alone lands at
                                   # that path in the application, a to at another

run:                               # steps run once the files are in, each asked first
  - label: make-id                 # the name typed after --run and --no-run
    description: Make this device's own ID, example_id.h   # shown with the question
    script: tools/make_id.py       # Python, run with the installer's own Python: the
                                   # application's tools/make_id.py, which the extra
                                   # above puts there. {library}/... is one in the library
    args: [example_id.h]           # given to the script, in the application's folder
    unless: example_id.h           # skipped when this file is there already

zephyr:                            # read by lib-installer only
  symbol:                          # the library's switch, CONFIG_EXAMPLE=y, last in its
    EXAMPLE: builds example, and its defaults hold while it is on
                                   # block in prj.conf. The name in capitals when left
                                   # out; symbol: EXAMPLE alone has no note
  project:                         # written into the application's own files, each in a
                                   # block of the library's, written again on every install
    conf: []                       # prj.conf, beside the switch; a line of the user's own
                                   # wins. A list, or groups under their titles:
                                   #   Logging:            between two lines of stars
                                   #     - LOG             a symbol alone is set to y
                                   #     - LOG_DEFAULT_LEVEL=2: warnings and errors
                                   #                       a note, a comment above it
    # sysbuild:                    # sysbuild.conf: sysbuild's settings, without SB_CONFIG_
    #   - BOOTLOADER_MCUBOOT
    cmake:                         # its CMakeLists.txt, under the place each line goes
      before-zephyr:               # above find_package(Zephyr)
        Your settings in example.conf, read after prj.conf:
          - list(APPEND EXTRA_CONF_FILE "${CMAKE_CURRENT_SOURCE_DIR}/example.conf")
                                   # a title over lines of CMake; they take no note
      after-zephyr: []             # at its end. {library} in a line is the library's
                                   # folder, wherever it is
  library:                         # written into the library's own folder, zephyr/
    kconfig:                       # its Kconfig: settings of other symbols, held while the
      Printing:                    # library is on, as configdefault; a line in prj.conf
        - PRINTK: example_hello() prints with printk()   # that sets one wins
    conf:                          # its Kconfig fragment, zephyr/example.conf, read after
      A quiet start:               # prj.conf: settings for every build, which win over
        - BOOT_BANNER=n: the first line printed is example's   # it, and what a default
                                   # cannot set, such as a member of a choice
    cmake:                         # its CMakeLists.txt, inside if(CONFIG_EXAMPLE)
      The application's folder, where example_id.h is made:
        - zephyr_library_include_directories(${APPLICATION_SOURCE_DIR})
  settings:                        # Kconfig symbols the user sets, CONFIG_<name> in the code
    - name: EXAMPLE_PERIOD_MS      # the symbol, started with the library's own
      type: int                    # bool, int, hex or string
      default: 500                 # required: true or false, a number, 0x.. or text
      range: [1, 86400000]         # int and hex only: [smallest, largest]
      prompt: Milliseconds between two times example_due() says yes
      help: |
        A loop that calls example_due() gets a yes once every this many
        milliseconds, and never waits for it.
    - name: EXAMPLE_GREETING
      type: string
      default: Hello from example
      prompt: What example_hello() prints
